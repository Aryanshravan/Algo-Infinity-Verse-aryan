<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>CDN Edge Cache Stampede (Thundering Herd) Simulator</title>
    <meta
      name="description"
      content="Visualize the Cache Stampede problem and how Request Collapsing (Promise Locking) solves it."
    />
    <link rel="stylesheet" href="cdn-cache-stampede-simulator.css" />
    <link rel="stylesheet" href="/modules/quick-notes/quick-notes.css" />
  </head>
  <body>
    <div class="container">
      <header>
        <h1>🌩️ CDN Cache Stampede Simulator</h1>
        <p>Visualize the Thundering Herd problem and Request Collapsing</p>
      </header>

      <!-- Controls -->
      <div class="controls">
        <div class="control-group">
          <label>
            <input type="checkbox" id="requestCollapsingToggle" />
            Enable Request Collapsing (Promise Locking)
          </label>
        </div>
        <div class="control-group">
          <label>Number of Users (per edge):</label>
          <input type="number" id="userCount" value="50" min="10" max="500" step="10" />
        </div>
        <div class="control-group">
          <button id="simulateBtn">💥 Simulate Traffic Spike</button>
          <button id="resetBtn">🔄 Reset Server</button>
        </div>
      </div>

      <!-- Visualization -->
      <div class="visualization">
        <svg id="cdnFlow" width="100%" height="500"></svg>
      </div>

      <!-- Stats Dashboard -->
      <div class="stats-dashboard">
        <div class="stat-card">
          <span class="stat-label">User Requests</span>
          <span class="stat-value" id="userRequestsCount">0</span>
        </div>
        <div class="stat-card">
          <span class="stat-label">Origin Requests</span>
          <span class="stat-value" id="originRequestsCount">0</span>
        </div>
        <div class="stat-card">
          <span class="stat-label">Origin Load</span>
          <span class="stat-value" id="originLoadValue">0%</span>
        </div>
        <div class="stat-card" id="serverStatusCard">
          <span class="stat-label">Origin Status</span>
          <span class="stat-value status-healthy" id="originStatus">HEALTHY</span>
        </div>
      </div>

      <!-- Log -->
      <div class="log-container">
        <h3>📋 Event Log</h3>
        <div id="logMessages"></div>
      </div>
    </div>

    <script src="cdn-cache-stampede-simulator.js"></script>
    <script src="/modules/quick-notes/quick-notes.js"></script>
  </body>
</html>
