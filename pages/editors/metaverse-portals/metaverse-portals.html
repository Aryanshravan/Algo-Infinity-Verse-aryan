<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>IPFS Metaverse Portals | Algo Infinity Verse</title>
    <link rel="stylesheet" href="/styles.css" />
    <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@400;700;900&family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet" />
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" />
    <!-- Monaco Editor -->
    <script src="https://unpkg.com/monaco-editor@0.36.1/min/vs/loader.js"></script>
    <style>
      body { margin: 0; overflow: hidden; background: #000; font-family: 'Poppins', sans-serif; color: #fff; }
      .app-container { display: flex; height: 100vh; }
      
      .sidebar { width: 450px; background: rgba(15, 23, 42, 0.95); border-right: 1px solid #0ea5e9; display: flex; flex-direction: column; z-index: 10; }
      .header { padding: 20px; border-bottom: 1px solid #334155; }
      .header h2 { margin: 0; color: #0ea5e9; font-family: 'Orbitron', sans-serif; font-size: 1.2rem; }
      .header p { margin: 5px 0 0 0; font-size: 0.8rem; color: #94a3b8; }
      
      #editor-container { flex: 1; min-height: 300px; }
      
      .controls { padding: 20px; border-top: 1px solid #334155; background: rgba(0,0,0,0.5); }
      .btn { background: linear-gradient(90deg, #0ea5e9, #0284c7); color: #fff; border: none; padding: 10px 20px; border-radius: 8px; font-weight: bold; cursor: pointer; width: 100%; transition: 0.3s; }
      .btn:hover { background: #38bdf8; transform: translateY(-2px); box-shadow: 0 0 15px rgba(14, 165, 233, 0.5); }
      
      .sim-container { flex: 1; position: relative; background: radial-gradient(circle at center, #020617 0%, #000 100%); perspective: 1000px; display: flex; justify-content: center; align-items: center; overflow: hidden; }
      
      /* The Portal */
      .portal-frame {
        width: 300px;
        height: 450px;
        border: 4px solid #0ea5e9;
        border-radius: 150px 150px 10px 10px;
        position: relative;
        transform-style: preserve-3d;
        box-shadow: 0 0 40px #0ea5e9, inset 0 0 40px #0ea5e9;
        overflow: hidden;
        transition: transform 0.1s;
      }

      .portal-inner {
        width: 100%;
        height: 100%;
        background: url('https://images.unsplash.com/photo-1618005182384-a83a8bd57fbe?q=80&w=2564&auto=format&fit=crop') center/cover;
        position: absolute;
        top: 0; left: 0;
        filter: hue-rotate(90deg) contrast(1.2);
        transform: scale(1.2); /* For parallax */
        transition: transform 0.1s;
      }
      
      .hud { position: absolute; top: 20px; right: 20px; background: rgba(0,0,0,0.8); padding: 15px; border-radius: 8px; border: 1px solid #0ea5e9; width: 280px; z-index: 10; }
      .hud h3 { margin: 0 0 10px 0; color: #0ea5e9; font-size: 1rem; font-family: 'Orbitron', sans-serif; }
      .metric { display: flex; justify-content: space-between; font-size: 0.75rem; color: #cbd5e1; margin-bottom: 5px; }
      .val { font-weight: bold; font-family: monospace; }
      .val-ipfs { color: #facc15; font-size: 0.65rem; word-break: break-all; text-align: right; width: 60%; }
      .val-fps { color: #10b981; }
    </style>
  </head>
  <body>
    
    <div class="app-container">
      <div class="sidebar">
        <div class="header">
          <h2><i class="fas fa-door-open"></i> WebXR IPFS Portals</h2>
          <p>Seamlessly stream assets from decentralized nodes</p>
        </div>
        
        <div id="editor-container"></div>
        
        <div class="controls">
          <button class="btn" onclick="initiateJump()"><i class="fas fa-random"></i> Traverse Dimensions</button>
        </div>
      </div>
      
      <div class="sim-container" id="sim">
        <!-- Background elements (Current Dimension) -->
        <div style="position:absolute; inset:0; background: url('https://images.unsplash.com/photo-1550684848-fac1c5b4e853?q=80&w=2670&auto=format&fit=crop') center/cover; opacity: 0.3; filter: grayscale(100%); z-index: -1;" id="currentDimBg"></div>

        <div class="portal-frame" id="portalFrame">
          <div class="portal-inner" id="portalInner"></div>
        </div>

        <div class="hud">
          <h3>Web3 XR Streaming</h3>
          <div class="metric"><span>Asset CID:</span> <span class="val val-ipfs" id="ipfsHash">QmYwAPJzv5CZsnA625s3Xf2nemtYgPpHdWEz79ojWnPbdG</span></div>
          <div class="metric"><span>Peers Discovered:</span> <span class="val">42</span></div>
          <div class="metric"><span>Buffer Health:</span> <span class="val val-fps" id="bufferVal">100%</span></div>
          <div class="metric" style="margin-top: 10px; border-top: 1px solid #334155; padding-top: 5px;">
            <span>Portal State:</span> <span class="val" id="statusVal" style="color:#0ea5e9">STABLE</span>
          </div>
        </div>
      </div>
    </div>

    <script>
      let editor;
      require.config({ paths: { 'vs': 'https://unpkg.com/monaco-editor@0.36.1/min/vs' }});
      require(['vs/editor/editor.main'], function() {
        editor = monaco.editor.create(document.getElementById('editor-container'), {
          value: `// IPFS Asynchronous Asset Streamer
// Prevent frame-drops during dimensional traverse

async function fetchDimension(cid) {
    // 1. Resolve IPFS hash via local node
    const node = await Web3Provider.getNode();
    
    // 2. Pre-buffer WebGL textures
    let stream = await node.cat(cid);
    
    // 3. Decompress via WebAssembly
    let buffer = await WasmDecompressor.run(stream);
    
    return buffer;
}`,
          language: 'javascript',
          theme: 'vs-dark',
          minimap: { enabled: false },
          automaticLayout: true
        });
      });

      // Parallax effect for non-Euclidean illusion
      const sim = document.getElementById('sim');
      const frame = document.getElementById('portalFrame');
      const inner = document.getElementById('portalInner');

      sim.addEventListener('mousemove', (e) => {
        let x = (e.clientX - sim.getBoundingClientRect().left) / sim.offsetWidth - 0.5;
        let y = (e.clientY - sim.getBoundingClientRect().top) / sim.offsetHeight - 0.5;

        // Rotate the frame slightly
        frame.style.transform = \`rotateY(\${x * 20}deg) rotateX(\${-y * 20}deg)\`;
        
        // Move the inner world the opposite way (parallax depth)
        inner.style.transform = \`scale(1.2) translateX(\${x * -60}px) translateY(\${y * -60}px)\`;
      });

      let dimensions = [
        { hash: "QmXoypizjW3WknFiJnKLwHCnL72vedxjQkDDP1mXWo6uco", hue: 0, url: "https://images.unsplash.com/photo-1542831371-29b0f74f9713?q=80&w=2670&auto=format&fit=crop" },
        { hash: "QmUNLLsPACCz1vLxQVkXqqLX5R1X345qqfHbsf67hvA3Nn", hue: 180, url: "https://images.unsplash.com/photo-1451187580459-43490279c0fa?q=80&w=2672&auto=format&fit=crop" },
        { hash: "QmYwAPJzv5CZsnA625s3Xf2nemtYgPpHdWEz79ojWnPbdG", hue: 90, url: "https://images.unsplash.com/photo-1618005182384-a83a8bd57fbe?q=80&w=2564&auto=format&fit=crop" }
      ];
      let currentDim = 2;

      async function initiateJump() {
        document.getElementById('statusVal').innerText = "STREAMING FROM IPFS...";
        document.getElementById('statusVal').style.color = "#facc15";
        
        let buf = 100;
        let bufInt = setInterval(() => {
          buf -= Math.random() * 20;
          if(buf < 10) buf = 10;
          document.getElementById('bufferVal').innerText = Math.floor(buf) + "%";
          if(buf < 40) document.getElementById('bufferVal').style.color = "#ef4444";
        }, 100);

        // Zoom into portal
        frame.style.transition = "transform 1s cubic-bezier(0.16, 1, 0.3, 1)";
        frame.style.transform = "scale(5)";
        
        await new Promise(r => setTimeout(r, 1000));
        clearInterval(bufInt);
        document.getElementById('bufferVal').innerText = "100%";
        document.getElementById('bufferVal').style.color = "#10b981";
        
        // Swap dimensions
        let oldDim = dimensions[currentDim];
        currentDim = (currentDim + 1) % dimensions.length;
        let newDim = dimensions[currentDim];
        
        document.getElementById('currentDimBg').style.background = \`url('\${oldDim.url}') center/cover\`;
        document.getElementById('ipfsHash').innerText = newDim.hash;
        
        inner.style.background = \`url('\${newDim.url}') center/cover\`;
        inner.style.filter = \`hue-rotate(\${newDim.hue}deg) contrast(1.2)\`;

        // Zoom out
        frame.style.transform = "scale(1)";
        
        setTimeout(() => {
          frame.style.transition = "transform 0.1s"; // restore parallax tracking
          document.getElementById('statusVal').innerText = "STABLE";
          document.getElementById('statusVal').style.color = "#0ea5e9";
        }, 1000);
      }
    </script>
  </body>
</html>
