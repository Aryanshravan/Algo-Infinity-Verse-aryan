<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Kardashev Stellar Engine Simulator | Algo Infinity Verse</title>
    <link rel="stylesheet" href="/styles.css" />
    <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@400;700;900&family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet" />
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" />
    <!-- Monaco Editor -->
    <script src="https://unpkg.com/monaco-editor@0.36.1/min/vs/loader.js"></script>
    <style>
      body { margin: 0; overflow: hidden; background: #000; font-family: 'Poppins', sans-serif; color: #fff; }
      .app-container { display: flex; height: 100vh; }
      
      .sidebar { width: 450px; background: rgba(15, 23, 42, 0.95); border-right: 1px solid #f97316; display: flex; flex-direction: column; z-index: 10; }
      .header { padding: 20px; border-bottom: 1px solid #334155; }
      .header h2 { margin: 0; color: #f97316; font-family: 'Orbitron', sans-serif; font-size: 1.2rem; }
      .header p { margin: 5px 0 0 0; font-size: 0.8rem; color: #94a3b8; }
      
      #editor-container { flex: 1; min-height: 300px; }
      
      .controls { padding: 20px; border-top: 1px solid #334155; background: rgba(0,0,0,0.5); }
      .btn { background: linear-gradient(90deg, #ea580c, #c2410c); color: #fff; border: none; padding: 10px 20px; border-radius: 8px; font-weight: bold; cursor: pointer; width: 100%; transition: 0.3s; }
      .btn:hover { background: #f97316; transform: translateY(-2px); box-shadow: 0 0 15px rgba(249, 115, 22, 0.5); }
      
      .sim-container { flex: 1; position: relative; background: #020617; overflow: hidden; }
      canvas { width: 100%; height: 100%; display: block; }
      
      .hud { position: absolute; top: 20px; left: 20px; background: rgba(0,0,0,0.8); padding: 15px; border-radius: 8px; border: 1px solid #f97316; width: 250px; z-index: 10; pointer-events: none; }
      .hud h3 { margin: 0 0 10px 0; color: #f97316; font-size: 1rem; font-family: 'Orbitron', sans-serif; }
      .metric { display: flex; justify-content: space-between; font-size: 0.8rem; color: #cbd5e1; margin-bottom: 5px; }
      .val { font-weight: bold; font-family: monospace; }
      .val-thrust { color: #facc15; }
      .val-danger { color: #ef4444; }
    </style>
  </head>
  <body>
    
    <div class="app-container">
      <div class="sidebar">
        <div class="header">
          <h2><i class="fas fa-satellite-dish"></i> Shkadov Thruster Simulator</h2>
          <p>Propel the Solar System safely out of the supernova path</p>
        </div>
        
        <div id="editor-container"></div>
        
        <div class="controls">
          <button class="btn" onclick="deployThruster()"><i class="fas fa-rocket"></i> Deploy Shkadov Mirror</button>
        </div>
      </div>
      
      <div class="sim-container">
        <!-- Background Stars -->
        <div style="position: absolute; inset:0; background: url('https://images.unsplash.com/photo-1506318137071-a8e063b4bec0?q=80&w=2693&auto=format&fit=crop') center/cover; opacity: 0.4; z-index: 0;"></div>
        
        <canvas id="stellarCanvas" style="position: relative; z-index: 1;"></canvas>
        <div class="hud">
          <h3>N-Body Telemetry</h3>
          <div class="metric"><span>Galactic Velocity:</span> <span class="val val-thrust" id="velVal">0.0 km/s</span></div>
          <div class="metric"><span>Earth Orbit Stability:</span> <span class="val" id="orbVal" style="color:#10b981;">100%</span></div>
          <div class="metric"><span>Distance to Supernova:</span> <span class="val val-danger" id="distVal">50.0 LY</span></div>
          <div class="metric" style="margin-top: 10px; border-top: 1px solid #334155; padding-top: 5px;">
            <span>Project Status:</span> <span class="val" id="statusVal" style="color:#94a3b8">STANDBY</span>
          </div>
        </div>
      </div>
    </div>

    <script>
      let editor;
      require.config({ paths: { 'vs': 'https://unpkg.com/monaco-editor@0.36.1/min/vs' }});
      require(['vs/editor/editor.main'], function() {
        editor = monaco.editor.create(document.getElementById('editor-container'), {
          value: `// Shkadov Thruster Orbital Controller
// Calculate the optimal mirror deployment angle and distance
// to generate asymmetrical radiation thrust without cooking Earth!

function calculateMirrorDeployment(sunMass, earthDistance) {
    // Return an object with distance (AU) and angle (radians)
    // Hint: Needs to be close enough for high radiation pressure, 
    // but far enough to not disrupt Earth's orbit via gravity.
    
    return {
        distance_AU: 0.8,
        angle_Rad: Math.PI / 4 // 45 degrees
    };
}`,
          language: 'javascript',
          theme: 'vs-dark',
          minimap: { enabled: false },
          automaticLayout: true
        });
      });

      const canvas = document.getElementById('stellarCanvas');
      const ctx = canvas.getContext('2d');
      
      let isDeployed = false;
      let time = 0;
      let earthAngle = 0;
      let sysX = 0;
      let sysY = 0;
      let velocity = 0;
      let supernovaDist = 50.0;
      let orbitalStability = 100;
      
      let mirrorConfig = { dist: 0, angle: 0 };
      
      function resize() { canvas.width = canvas.clientWidth; canvas.height = canvas.clientHeight; }
      window.addEventListener('resize', resize);
      resize();

      function animate() {
        ctx.clearRect(0, 0, canvas.width, canvas.height);
        
        let cx = (canvas.width / 2) + sysX;
        let cy = (canvas.height / 2) + sysY;

        time += 0.02;

        // Draw Supernova Threat (Red glowing aura on the edge)
        let grad = ctx.createLinearGradient(0, 0, canvas.width, canvas.height);
        grad.addColorStop(0, 'rgba(239, 68, 68, 0.2)');
        grad.addColorStop(1, 'transparent');
        ctx.fillStyle = grad;
        ctx.fillRect(0,0, canvas.width, canvas.height);

        // Draw Sun
        ctx.beginPath();
        ctx.arc(cx, cy, 40, 0, Math.PI * 2);
        let sunGrad = ctx.createRadialGradient(cx, cy, 5, cx, cy, 40);
        sunGrad.addColorStop(0, '#fff');
        sunGrad.addColorStop(0.5, '#facc15');
        sunGrad.addColorStop(1, '#ea580c');
        ctx.fillStyle = sunGrad;
        ctx.shadowBlur = 50;
        ctx.shadowColor = '#facc15';
        ctx.fill();
        ctx.shadowBlur = 0;

        // Draw Earth Orbit Path
        ctx.beginPath();
        ctx.arc(cx, cy, 200, 0, Math.PI * 2);
        ctx.strokeStyle = 'rgba(255, 255, 255, 0.1)';
        ctx.stroke();

        // Draw Earth
        earthAngle += (0.01 * (orbitalStability / 100)); // Orbit slows if destabilized
        let ex = cx + Math.cos(earthAngle) * 200;
        let ey = cy + Math.sin(earthAngle) * 200;
        ctx.beginPath();
        ctx.arc(ex, ey, 8, 0, Math.PI * 2);
        ctx.fillStyle = '#3b82f6';
        ctx.fill();

        // Draw Shkadov Mirror
        if(isDeployed) {
           let mDist = mirrorConfig.dist * 200; // AU to px scale
           let mx = cx + Math.cos(mirrorConfig.angle) * mDist;
           let my = cy + Math.sin(mirrorConfig.angle) * mDist;
           
           // Draw asymmetrical radiation thrust (cone of light)
           ctx.beginPath();
           ctx.moveTo(cx, cy);
           ctx.lineTo(cx + Math.cos(mirrorConfig.angle - 0.5) * mDist * 2, cy + Math.sin(mirrorConfig.angle - 0.5) * mDist * 2);
           ctx.lineTo(cx + Math.cos(mirrorConfig.angle + 0.5) * mDist * 2, cy + Math.sin(mirrorConfig.angle + 0.5) * mDist * 2);
           ctx.fillStyle = 'rgba(250, 204, 21, 0.15)';
           ctx.fill();

           // Draw the giant arc mirror
           ctx.beginPath();
           ctx.arc(cx, cy, mDist, mirrorConfig.angle - 0.5, mirrorConfig.angle + 0.5);
           ctx.strokeStyle = '#94a3b8';
           ctx.lineWidth = 6;
           ctx.stroke();

           // Physics Updates
           velocity += 0.05;
           sysX -= Math.cos(mirrorConfig.angle) * velocity;
           sysY -= Math.sin(mirrorConfig.angle) * velocity;
           
           supernovaDist += (velocity / 100);
           if (mirrorConfig.dist < 0.5) {
               orbitalStability -= 0.5; // Mirror too close, gravity disrupted!
           }
           
           if(orbitalStability < 0) orbitalStability = 0;
           
           document.getElementById('velVal').innerText = (velocity * 1000).toLocaleString(undefined, {maximumFractionDigits:0}) + " km/s";
           document.getElementById('orbVal').innerText = orbitalStability.toFixed(1) + "%";
           if(orbitalStability < 50) document.getElementById('orbVal').style.color = "#ef4444";
           
           document.getElementById('distVal').innerText = supernovaDist.toFixed(2) + " LY";
           
           if (orbitalStability <= 0) {
               document.getElementById('statusVal').innerText = "EARTH DESTROYED";
               document.getElementById('statusVal').style.color = "#ef4444";
               isDeployed = false; // Stop sim
           } else if (supernovaDist > 60) {
               document.getElementById('statusVal').innerText = "SYSTEM SAVED";
               document.getElementById('statusVal').style.color = "#10b981";
           }
        } else if (supernovaDist < 50) {
           // Not deployed, supernova approaching
           supernovaDist -= 0.05;
           document.getElementById('distVal').innerText = supernovaDist.toFixed(2) + " LY";
           if(supernovaDist <= 0) {
               document.getElementById('statusVal').innerText = "SUPERNOVA IMPACT";
               document.getElementById('statusVal').style.color = "#ef4444";
           }
        }

        requestAnimationFrame(animate);
      }
      animate();

      function deployThruster() {
        if(isDeployed) return;
        
        try {
           eval(editor.getValue());
           if(typeof calculateMirrorDeployment === 'function') {
               let config = calculateMirrorDeployment(1.989e30, 1.0);
               mirrorConfig.dist = config.distance_AU || 0.8;
               mirrorConfig.angle = config.angle_Rad || 0;
               
               isDeployed = true;
               document.getElementById('statusVal').innerText = "THRUSTER ACTIVE";
               document.getElementById('statusVal').style.color = "#facc15";
           }
        } catch(e) {
           alert("Algorithm Error: " + e.message);
        }
      }
    </script>
  </body>
</html>
