<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>DNA Storage Sandbox | Algo Infinity Verse</title>
    <link rel="stylesheet" href="/styles.css" />
    <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@400;700;900&family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet" />
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" />
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <style>
      .dna-container { padding: 40px 20px; max-width: 1200px; margin: 0 auto; color: #e2e8f0; }
      .dna-panel { background: rgba(15, 23, 42, 0.8); border: 1px solid #10b981; padding: 20px; border-radius: 12px; margin-bottom: 20px; }
      .dna-strand { font-family: monospace; font-size: 1.2rem; letter-spacing: 3px; color: #34d399; word-break: break-all; margin: 20px 0; background: rgba(0,0,0,0.5); padding: 15px; border-radius: 8px; border-left: 4px solid #10b981; }
      .metric { background: #1e293b; padding: 10px; border-radius: 8px; flex: 1; text-align: center; border: 1px solid #334155; }
      .metric-val { font-size: 1.5rem; font-weight: bold; color: #facc15; }
      .btn-dna { background: linear-gradient(90deg, #10b981, #059669); color: white; border: none; padding: 10px 20px; border-radius: 8px; font-weight: bold; cursor: pointer; transition: 0.3s; }
      .btn-dna:hover { transform: translateY(-2px); box-shadow: 0 4px 12px rgba(16,185,129,0.4); }
    </style>
  </head>
  <body class="dark-mode" style="background: #020617;">
    <div id="navbar-placeholder"></div>

    <div class="dna-container">
      <h1 style="color: #10b981;"><i class="fas fa-dna"></i> DNA Data Storage Synthesizer</h1>
      <p style="color: #94a3b8; margin-bottom: 30px;">Encode binary payloads into synthetic biological oligonucleotides (A, C, G, T) for extreme long-term cold storage.</p>
      
      <div style="display: flex; gap: 20px;">
        <div style="flex: 1;">
          <div class="dna-panel">
            <h3><i class="fas fa-file-code"></i> Input Binary Payload</h3>
            <textarea id="binInput" style="width: 100%; height: 100px; background: #000; color: #10b981; border: 1px solid #334155; padding: 10px; font-family: monospace; border-radius: 4px;" placeholder="Enter binary string...">0110100001100101011011000110110001101111</textarea>
            <button class="btn-dna" style="margin-top: 15px; width: 100%;" onclick="synthesizeDNA()"><i class="fas fa-vial"></i> Synthesize to DNA</button>
          </div>
          
          <div class="dna-panel">
            <h3><i class="fas fa-microscope"></i> Synthesized Oligonucleotide</h3>
            <div id="dnaOutput" class="dna-strand">Awaiting Synthesis...</div>
          </div>
        </div>

        <div style="flex: 1;">
          <div class="dna-panel">
            <h3><i class="fas fa-chart-pie"></i> Biological Viability Analysis</h3>
            <div style="display: flex; gap: 10px; margin-bottom: 20px;">
              <div class="metric">
                <div style="font-size: 0.8rem; color: #94a3b8;">GC-Content</div>
                <div id="gcMetric" class="metric-val">--%</div>
              </div>
              <div class="metric">
                <div style="font-size: 0.8rem; color: #94a3b8;">Max Homopolymer</div>
                <div id="homoMetric" class="metric-val">--</div>
              </div>
              <div class="metric">
                <div style="font-size: 0.8rem; color: #94a3b8;">Status</div>
                <div id="statusMetric" class="metric-val" style="color: #94a3b8;">Idle</div>
              </div>
            </div>
            <canvas id="dnaChart"></canvas>
          </div>
        </div>
      </div>
    </div>

    <div id="footer-placeholder"></div>

    <script src="/script.js"></script>
    <script type="module" src="/dist/legacy-bundle.mjs"></script>
    <script>
      fetch('/partials/navbar.html').then(r=>r.text()).then(html => document.getElementById('navbar-placeholder').innerHTML = html).catch(e => console.log('Navbar load failed.'));
      fetch('/partials/footer.html').then(r=>r.text()).then(html => document.getElementById('footer-placeholder').innerHTML = html).catch(e => console.log('Footer load failed.'));

      let chartInstance = null;

      function synthesizeDNA() {
        const bin = document.getElementById("binInput").value.replace(/[^01]/g, '');
        if (!bin) return;

        // Simple 2-bit mapping (00->A, 01->C, 10->G, 11->T)
        let dna = "";
        let gCount = 0, cCount = 0, maxHomo = 0;
        let currChar = '', currRun = 0;

        for (let i = 0; i < bin.length; i += 2) {
          const chunk = bin.substring(i, i+2);
          let base = 'A';
          if (chunk === '00') base = 'A';
          if (chunk === '01') base = 'C';
          if (chunk === '10') base = 'G';
          if (chunk === '11') base = 'T';
          
          if (base === 'G') gCount++;
          if (base === 'C') cCount++;

          if (base === currChar) {
            currRun++;
            if (currRun > maxHomo) maxHomo = currRun;
          } else {
            currChar = base;
            currRun = 1;
          }
          
          dna += base;
        }

        document.getElementById("dnaOutput").innerText = dna || "Synthesis Failed";
        
        const gcContent = dna.length ? ((gCount + cCount) / dna.length) * 100 : 0;
        document.getElementById("gcMetric").innerText = gcContent.toFixed(1) + "%";
        document.getElementById("homoMetric").innerText = maxHomo;

        const status = document.getElementById("statusMetric");
        if (gcContent > 60 || gcContent < 40) {
          status.innerText = "FAIL (GC-Bias)";
          status.style.color = "#ef4444";
        } else if (maxHomo > 4) {
          status.innerText = "FAIL (Homopolymer)";
          status.style.color = "#ef4444";
        } else {
          status.innerText = "VIABLE (Stable)";
          status.style.color = "#10b981";
        }

        renderChart([
          (dna.match(/A/g)||[]).length,
          (dna.match(/C/g)||[]).length,
          (dna.match(/G/g)||[]).length,
          (dna.match(/T/g)||[]).length
        ]);
      }

      function renderChart(data) {
        const ctx = document.getElementById('dnaChart');
        if (chartInstance) chartInstance.destroy();
        chartInstance = new Chart(ctx, {
          type: 'doughnut',
          data: {
            labels: ['Adenine (A)', 'Cytosine (C)', 'Guanine (G)', 'Thymine (T)'],
            datasets: [{
              data: data,
              backgroundColor: ['#ef4444', '#eab308', '#3b82f6', '#10b981'],
              borderWidth: 0
            }]
          },
          options: { responsive: true, plugins: { legend: { position: 'bottom', labels: { color: '#94a3b8' } } } }
        });
      }

      // Initial chart
      renderChart([0,0,0,0]);
    </script>
  </body>
</html>
