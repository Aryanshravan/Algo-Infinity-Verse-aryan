<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Quantum Loop Gravity Simulator | Algo Infinity Verse</title>
    <link rel="stylesheet" href="/styles.css" />
    <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@400;700;900&family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet" />
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" />
    <!-- Monaco Editor -->
    <script src="https://unpkg.com/monaco-editor@0.36.1/min/vs/loader.js"></script>
    <style>
      body { margin: 0; overflow: hidden; background: #000; font-family: 'Poppins', sans-serif; color: #fff; }
      .app-container { display: flex; height: 100vh; }
      
      .sidebar { width: 450px; background: rgba(0, 0, 0, 0.95); border-right: 1px solid #a855f7; display: flex; flex-direction: column; z-index: 10; }
      .header { padding: 20px; border-bottom: 1px solid #334155; }
      .header h2 { margin: 0; color: #a855f7; font-family: 'Orbitron', sans-serif; font-size: 1.2rem; }
      .header p { margin: 5px 0 0 0; font-size: 0.8rem; color: #94a3b8; }
      
      #editor-container { flex: 1; min-height: 300px; }
      
      .controls { padding: 20px; border-top: 1px solid #334155; background: rgba(0,0,0,0.5); }
      .btn { background: linear-gradient(90deg, #9333ea, #7e22ce); color: #fff; border: none; padding: 10px 20px; border-radius: 8px; font-weight: bold; cursor: pointer; width: 100%; transition: 0.3s; }
      .btn:hover { background: #a855f7; transform: translateY(-2px); box-shadow: 0 0 15px rgba(168, 85, 247, 0.5); }
      
      .sim-container { flex: 1; position: relative; background: #000; overflow: hidden; }
      canvas { width: 100%; height: 100%; display: block; }
      
      .hud { position: absolute; top: 20px; left: 20px; background: rgba(0,0,0,0.8); padding: 15px; border-radius: 8px; border: 1px solid #a855f7; width: 250px; z-index: 10; pointer-events: none; }
      .hud h3 { margin: 0 0 10px 0; color: #a855f7; font-size: 1rem; font-family: 'Orbitron', sans-serif; }
      .metric { display: flex; justify-content: space-between; font-size: 0.8rem; color: #cbd5e1; margin-bottom: 5px; }
      .val { font-weight: bold; font-family: monospace; }
      .val-mass { color: #f43f5e; }
      .val-radiation { color: #2dd4bf; }
    </style>
  </head>
  <body>
    
    <div class="app-container">
      <div class="sidebar">
        <div class="header">
          <h2><i class="fas fa-atom"></i> Quantum Loop Gravity Engine</h2>
          <p>Calculate Hawking Radiation emission rates in WebAssembly</p>
        </div>
        
        <div id="editor-container"></div>
        
        <div class="controls">
          <button class="btn" onclick="compileAndRun()"><i class="fas fa-microchip"></i> Compile Tensor Math & Execute</button>
        </div>
      </div>
      
      <div class="sim-container">
        <canvas id="quantumCanvas"></canvas>
        <div class="hud">
          <h3>Singularity Metrics</h3>
          <div class="metric"><span>Spacetime Curvature:</span> <span class="val">Extreme</span></div>
          <div class="metric"><span>Black Hole Mass (M):</span> <span class="val val-mass" id="massVal">10.0 M☉</span></div>
          <div class="metric"><span>Hawking Radiation (P):</span> <span class="val val-radiation" id="radVal">0.00e-29 W</span></div>
          <div class="metric" style="margin-top: 10px; border-top: 1px solid #334155; padding-top: 5px;">
            <span>Event Horizon:</span> <span class="val" id="statusVal" style="color:#ef4444">UNSTABLE</span>
          </div>
        </div>
      </div>
    </div>

    <script>
      let editor;
      require.config({ paths: { 'vs': 'https://unpkg.com/monaco-editor@0.36.1/min/vs' }});
      require(['vs/editor/editor.main'], function() {
        editor = monaco.editor.create(document.getElementById('editor-container'), {
          value: `// Hawking Radiation Calculator
// Implement the Stefan-Boltzmann-Schwarzschild equation
// P = (hbar * c^6) / (15360 * pi * G^2 * M^2)

const G = 6.674e-11;
const c = 299792458;
const hbar = 1.054e-34;
const pi = Math.PI;

function calculateHawkingRadiation(massInSolarMasses) {
    // 1 Solar Mass = 1.989e30 kg
    let M = massInSolarMasses * 1.989e30;
    
    // Write the equation here to return Power in Watts
    let power = (hbar * Math.pow(c, 6)) / (15360 * pi * Math.pow(G, 2) * Math.pow(M, 2));
    return power;
}`,
          language: 'javascript',
          theme: 'vs-dark',
          minimap: { enabled: false },
          automaticLayout: true
        });
      });

      const canvas = document.getElementById('quantumCanvas');
      const ctx = canvas.getContext('2d');
      
      let time = 0;
      let mass = 10.0;
      let isCompiled = false;
      
      function resize() { canvas.width = canvas.clientWidth; canvas.height = canvas.clientHeight; }
      window.addEventListener('resize', resize);
      resize();

      function drawSpacetimeGrid(cx, cy, intensity) {
        ctx.strokeStyle = 'rgba(168, 85, 247, 0.3)';
        ctx.lineWidth = 1;

        let gridSpacing = 40;
        let influenceRadius = 300;

        for (let x = -canvas.width; x < canvas.width; x += gridSpacing) {
          ctx.beginPath();
          for (let y = -canvas.height; y < canvas.height; y += 10) {
            // Apply gravitational lensing / warping effect
            let dx = x - cx;
            let dy = y - cy;
            let dist = Math.sqrt(dx*dx + dy*dy);
            
            let pull = 0;
            if(dist > 50) { // Don't pull inside event horizon
               pull = (influenceRadius * intensity) / dist;
            }
            
            let wx = x - (dx/dist) * pull;
            let wy = y - (dy/dist) * pull;
            
            if (y === -canvas.height) ctx.moveTo(wx, wy);
            else ctx.lineTo(wx, wy);
          }
          ctx.stroke();
        }
      }

      function drawBlackHole(cx, cy) {
        // Event Horizon (Black)
        ctx.beginPath();
        ctx.arc(cx, cy, 50, 0, Math.PI * 2);
        ctx.fillStyle = '#000';
        ctx.fill();
        
        // Accretion Disk (Glowing Purple/Cyan)
        ctx.beginPath();
        ctx.ellipse(cx, cy, 180, 40, 0, 0, Math.PI * 2);
        ctx.strokeStyle = 'rgba(45, 212, 191, 0.8)';
        ctx.lineWidth = 2;
        ctx.stroke();
        
        // Photon Sphere Glow
        ctx.beginPath();
        ctx.arc(cx, cy, 55, 0, Math.PI * 2);
        ctx.shadowBlur = 30;
        ctx.shadowColor = '#a855f7';
        ctx.strokeStyle = 'rgba(168, 85, 247, 0.9)';
        ctx.lineWidth = 3;
        ctx.stroke();
        ctx.shadowBlur = 0;
      }

      function drawHawkingRadiation(cx, cy, rate) {
         if(rate <= 0) return;
         
         // Visualize radiation as tiny particles escaping
         for(let i=0; i<5; i++) {
            let angle = Math.random() * Math.PI * 2;
            let dist = 55 + (time * Math.random() * 50) % 200;
            ctx.beginPath();
            ctx.arc(cx + Math.cos(angle)*dist, cy + Math.sin(angle)*dist, 1.5, 0, Math.PI*2);
            ctx.fillStyle = '#2dd4bf'; // Cyan radiation
            ctx.fill();
         }
      }

      function animate() {
        ctx.fillStyle = 'rgba(0, 0, 0, 0.4)';
        ctx.fillRect(0, 0, canvas.width, canvas.height);
        
        let cx = canvas.width / 2;
        let cy = canvas.height / 2;
        
        time += 0.05;

        // Dynamic mass decay if compiled
        let radiationPower = 0;
        if(isCompiled) {
          try {
            eval(editor.getValue());
            radiationPower = calculateHawkingRadiation(mass);
            // Black hole loses mass very slowly in this sim for visual effect
            mass -= 0.001; 
            if(mass < 0.1) mass = 0.1;
            
            document.getElementById('massVal').innerText = mass.toFixed(3) + " M☉";
            document.getElementById('radVal').innerText = radiationPower.toExponential(2) + " W";
            document.getElementById('statusVal').innerText = "STABILIZED (EVAPORATING)";
            document.getElementById('statusVal').style.color = "#2dd4bf";
          } catch(e) {}
        }

        drawSpacetimeGrid(cx, cy, mass * 2);
        drawHawkingRadiation(cx, cy, radiationPower);
        drawBlackHole(cx, cy);

        requestAnimationFrame(animate);
      }
      animate();

      function compileAndRun() {
        isCompiled = true;
      }
    </script>
  </body>
</html>
