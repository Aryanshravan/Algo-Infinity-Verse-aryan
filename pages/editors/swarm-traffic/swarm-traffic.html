<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Autonomous Swarm Traffic | Algo Infinity Verse</title>
    <link rel="stylesheet" href="/styles.css" />
    <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@400;700;900&family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet" />
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" />
    <!-- Monaco Editor -->
    <script src="https://unpkg.com/monaco-editor@0.36.1/min/vs/loader.js"></script>
    <style>
      body { margin: 0; overflow: hidden; background: #000; font-family: 'Poppins', sans-serif; color: #fff; }
      .app-container { display: flex; height: 100vh; }
      
      .sidebar { width: 450px; background: rgba(15, 23, 42, 0.95); border-right: 1px solid #eab308; display: flex; flex-direction: column; z-index: 10; }
      .header { padding: 20px; border-bottom: 1px solid #334155; }
      .header h2 { margin: 0; color: #eab308; font-family: 'Orbitron', sans-serif; font-size: 1.2rem; }
      .header p { margin: 5px 0 0 0; font-size: 0.8rem; color: #94a3b8; }
      
      #editor-container { flex: 1; min-height: 300px; }
      
      .controls { padding: 20px; border-top: 1px solid #334155; background: rgba(0,0,0,0.5); }
      .btn { background: linear-gradient(90deg, #ca8a04, #a16207); color: #fff; border: none; padding: 10px 20px; border-radius: 8px; font-weight: bold; cursor: pointer; width: 100%; transition: 0.3s; }
      .btn:hover { background: #eab308; transform: translateY(-2px); box-shadow: 0 0 15px rgba(234, 179, 8, 0.5); }
      
      .sim-container { flex: 1; position: relative; background: #111827; overflow: hidden; }
      canvas { width: 100%; height: 100%; display: block; }
      
      .hud { position: absolute; top: 20px; left: 20px; background: rgba(0,0,0,0.8); padding: 15px; border-radius: 8px; border: 1px solid #eab308; width: 250px; z-index: 10; pointer-events: none; }
      .hud h3 { margin: 0 0 10px 0; color: #eab308; font-size: 1rem; font-family: 'Orbitron', sans-serif; }
      .metric { display: flex; justify-content: space-between; font-size: 0.8rem; color: #cbd5e1; margin-bottom: 5px; }
      .val { font-weight: bold; font-family: monospace; }
      .val-flow { color: #3b82f6; }
      .val-crash { color: #ef4444; }
    </style>
  </head>
  <body>
    
    <div class="app-container">
      <div class="sidebar">
        <div class="header">
          <h2><i class="fas fa-car-side"></i> Smart Grid Swarm Controller</h2>
          <p>Optimize 150mph traffic via Peer-to-Peer negotiation</p>
        </div>
        
        <div id="editor-container"></div>
        
        <div class="controls">
          <button class="btn" onclick="startSim()"><i class="fas fa-traffic-light"></i> Execute Intersection Algorithm</button>
        </div>
      </div>
      
      <div class="sim-container">
        <!-- Grid Background -->
        <div style="position: absolute; inset:0; background: 
            linear-gradient(rgba(234, 179, 8, 0.05) 1px, transparent 1px),
            linear-gradient(90deg, rgba(234, 179, 8, 0.05) 1px, transparent 1px);
            background-size: 50px 50px; pointer-events: none; z-index: 0;"></div>
        
        <canvas id="trafficCanvas" style="position: relative; z-index: 1;"></canvas>
        
        <div class="hud">
          <h3>Traffic Telemetry</h3>
          <div class="metric"><span>Network Throughput:</span> <span class="val val-flow" id="flowVal">0 / min</span></div>
          <div class="metric"><span>Catastrophic Collisions:</span> <span class="val val-crash" id="crashVal">0</span></div>
          <div class="metric" style="margin-top: 10px; border-top: 1px solid #334155; padding-top: 5px;">
            <span>System State:</span> <span class="val" id="statusVal" style="color:#94a3b8">OFFLINE</span>
          </div>
        </div>
      </div>
    </div>

    <script>
      let editor;
      require.config({ paths: { 'vs': 'https://unpkg.com/monaco-editor@0.36.1/min/vs' }});
      require(['vs/editor/editor.main'], function() {
        editor = monaco.editor.create(document.getElementById('editor-container'), {
          value: `// Peer-to-Peer Intersection Protocol
// Return velocity multiplier (0.0 to 2.0) for approaching vehicles.
// Maximize throughput, minimize crashes.

function negotiateIntersection(vehicleA, vehicleB, distanceToCenter) {
    // Basic logic: if too close, someone must slow down.
    // If you return 1.0, they maintain 150mph.
    // Overly conservative algorithms cause traffic jams!
    
    if (distanceToCenter < 100) {
        // Warning: This naive logic causes crashes at high volumes!
        if(vehicleA.id < vehicleB.id) return { vA: 0.2, vB: 1.0 };
        else return { vA: 1.0, vB: 0.2 };
    }
    
    return { vA: 1.0, vB: 1.0 }; // maintain speed
}`,
          language: 'javascript',
          theme: 'vs-dark',
          minimap: { enabled: false },
          automaticLayout: true
        });
      });

      const canvas = document.getElementById('trafficCanvas');
      const ctx = canvas.getContext('2d');
      
      let isSimulating = false;
      let cars = [];
      let nextId = 1;
      let crashes = 0;
      let passed = 0;
      let frame = 0;
      
      function resize() { canvas.width = canvas.clientWidth; canvas.height = canvas.clientHeight; }
      window.addEventListener('resize', resize);
      resize();

      function spawnCar() {
         let cx = canvas.width / 2;
         let cy = canvas.height / 2;
         
         // 4 spawn points (N, S, E, W)
         let dir = Math.floor(Math.random() * 4);
         let car = { id: nextId++, x:0, y:0, vx:0, vy:0, color: '#' + Math.floor(Math.random()*16777215).toString(16).padStart(6, '0') };
         let speed = 5; // Base speed (150mph sim)
         let offset = 20; // Lane offset
         
         if(dir === 0) { car.x = cx - offset; car.y = -50; car.vy = speed; } // From North
         else if(dir === 1) { car.x = cx + offset; car.y = canvas.height + 50; car.vy = -speed; } // From South
         else if(dir === 2) { car.x = -50; car.y = cy + offset; car.vx = speed; } // From West
         else if(dir === 3) { car.x = canvas.width + 50; car.y = cy - offset; car.vx = -speed; } // From East
         
         cars.push(car);
      }

      function drawIntersection() {
         let cx = canvas.width / 2;
         let cy = canvas.height / 2;
         
         ctx.fillStyle = '#1e293b';
         // vertical road
         ctx.fillRect(cx - 50, 0, 100, canvas.height);
         // horizontal road
         ctx.fillRect(0, cy - 50, canvas.width, 100);
         
         // Intersection box
         ctx.strokeStyle = '#eab308';
         ctx.lineWidth = 2;
         ctx.strokeRect(cx - 50, cy - 50, 100, 100);
      }

      function animate() {
        ctx.fillStyle = 'rgba(17, 24, 39, 0.6)';
        ctx.fillRect(0, 0, canvas.width, canvas.height);
        
        drawIntersection();
        let cx = canvas.width / 2;
        let cy = canvas.height / 2;

        if (isSimulating) {
            frame++;
            if(frame % 15 === 0) spawnCar(); // Spawn frequently
            
            // Apply Algorithm (N^2 naive check for intersection zone)
            for(let i=0; i<cars.length; i++) {
                for(let j=i+1; j<cars.length; j++) {
                    let dToC_A = Math.hypot(cars[i].x - cx, cars[i].y - cy);
                    let dToC_B = Math.hypot(cars[j].x - cx, cars[j].y - cy);
                    
                    // If both are approaching the intersection zone
                    if(dToC_A < 200 && dToC_B < 200) {
                        try {
                            eval(editor.getValue());
                            let res = negotiateIntersection(cars[i], cars[j], Math.min(dToC_A, dToC_B));
                            if(res) {
                                // Apply velocity multipliers
                                cars[i].vMult = res.vA;
                                cars[j].vMult = res.vB;
                            }
                        } catch(e) {}
                    }
                }
            }
            
            // Move and draw cars
            for(let i = cars.length - 1; i >= 0; i--) {
                let c = cars[i];
                let mult = c.vMult !== undefined ? c.vMult : 1.0;
                
                c.x += c.vx * mult;
                c.y += c.vy * mult;
                c.vMult = 1.0; // Reset
                
                // Draw car
                ctx.beginPath();
                ctx.arc(c.x, c.y, 8, 0, Math.PI * 2);
                ctx.fillStyle = c.color;
                ctx.fill();
                
                // Check collisions
                for(let j=0; j<cars.length; j++) {
                    if(i !== j && Math.hypot(c.x - cars[j].x, c.y - cars[j].y) < 15) {
                        // CRASH!
                        crashes++;
                        
                        // Explosion effect
                        ctx.beginPath();
                        ctx.arc(c.x, c.y, 25, 0, Math.PI * 2);
                        ctx.fillStyle = 'rgba(239, 68, 68, 0.8)';
                        ctx.fill();
                        
                        // Remove cars
                        cars.splice(Math.max(i, j), 1);
                        cars.splice(Math.min(i, j), 1);
                        i--; // Adjust index
                        break;
                    }
                }
                
                // Check if passed screen
                if(c && (c.x < -100 || c.x > canvas.width + 100 || c.y < -100 || c.y > canvas.height + 100)) {
                    cars.splice(i, 1);
                    passed++;
                }
            }
            
            document.getElementById('flowVal').innerText = (passed * (60 / (frame/60))).toFixed(0) + " / min";
            document.getElementById('crashVal').innerText = crashes;
            
            if(crashes > 5) {
                document.getElementById('statusVal').innerText = "GRIDLOCK / MASS CASUALTY";
                document.getElementById('statusVal').style.color = "#ef4444";
                isSimulating = false;
            } else if (passed > 50) {
                 document.getElementById('statusVal').innerText = "HIGH THROUGHPUT";
                 document.getElementById('statusVal').style.color = "#10b981";
            }
        }

        requestAnimationFrame(animate);
      }
      animate();

      function startSim() {
        cars = [];
        crashes = 0;
        passed = 0;
        frame = 0;
        nextId = 1;
        isSimulating = true;
        document.getElementById('statusVal').innerText = "SWARM ACTIVE";
        document.getElementById('statusVal').style.color = "#3b82f6";
      }
    </script>
  </body>
</html>
